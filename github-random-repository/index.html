<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Random Repository</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="github-repository">
        <h1>GitHub Repository Finder</h1>
        <div class="dropdown">
          <button class="dropdown-btn">Select a Language</button>
          <ul class="dropdown-list"></ul>
        </div>
        <div class="github-information">
          <div class="github-display">Please select a language</div>
          <button class="btn-retry" hidden>Click to retry</button>
          <button class="btn-refresh" hidden>Refresh</button>
        </div>
      </div>
    </main>
  </body>
</html>
